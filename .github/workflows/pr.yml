name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting & Clippy
    # Self-hosted runner: skip fork PRs (untrusted code); allow same-repo PRs, push, merge_group.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.BUILD_RUNNER || 'sp1-builder' }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # Rust toolchain (rustfmt/clippy) + protoc are pre-installed on the self-hosted runner.
      - name: Run rustfmt
        run: cargo fmt --all -- --check
        env:
          CARGO_INCREMENTAL: 1

      - name: Run cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings -A incomplete-features
        env:
          CARGO_INCREMENTAL: 1

      - name: Test guest primitives
        run: cargo test -p sp1-vector-primitives --locked

      - name: Execute saved guest inputs
        run: cargo test -p sp1-vectorx-script --lib saved_inputs_execute_with_current_guest --locked

  elf:
    # Self-hosted runner: skip fork PRs (untrusted code); allow same-repo PRs, push, merge_group.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.BUILD_RUNNER || 'sp1-builder' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install ZisK guest builder
        env:
          ZISK_HOME: ${{ runner.temp }}/zisk-vector
          RUSTUP_HOME: ${{ runner.temp }}/zisk-rustup
        run: |
          mkdir -p "$ZISK_HOME"
          curl -fsSL https://github.com/0xPolygonHermez/zisk/releases/download/v1.3.2-alpha/cargo_zisk_linux_amd64.tar.gz | tar -xz -C "$ZISK_HOME"
          "$ZISK_HOME/bin/cargo-zisk-cpu" toolchain install --toolchain-version zisk-4.0.0
      - name: Verify the ZisK Vector binary
        env:
          ZISK_HOME: ${{ runner.temp }}/zisk-vector
          RUSTUP_HOME: ${{ runner.temp }}/zisk-rustup
        run: |
          cd program
          "$ZISK_HOME/bin/cargo-zisk-cpu" build --release
          cmp target/elf/riscv64ima-zisk-zkvm-elf/release/sp1-vectorx-program ../elf/vector-elf
