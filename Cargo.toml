[workspace]
members = ["script", "services", "primitives", "program"]
resolver = "2"

[workspace.dependencies]
# Avail
avail-subxt = { package = "avail-rust-client", version = "0.2.15", default-features = false, features = ["native", "reqwest"] }
codec = { package = "parity-scale-codec", version = "3", default-features = false }

# Cryptography
ed25519-consensus = { version = "2.1", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
blake2 = "0.10.6"

# Alloy
alloy = { version = "=1.1.0", features = ["full"] }

# Common
anyhow = "1.0.68"
clap = { version = "4.0", features = ["derive"] }
dotenv = "0.15.0"
env_logger = "0.9.0"
hex = "0.4.3"
log = "0.4.14"
serde_json = "1.0.86"
tokio = { version = "1.2.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
itertools = "0.10.5"
chrono = "0.4.39"
impl-serde = { version = "0.5.0" }

# ZisK
zisk-sdk = { git = "https://github.com/0xPolygonHermez/zisk", rev = "fa82851b8707a6f2560fc96fd8e4f5acc406be1b" }
ziskos = { git = "https://github.com/0xPolygonHermez/zisk", rev = "fa82851b8707a6f2560fc96fd8e4f5acc406be1b" }

reqwest = { version = "0.11.20", features = ["json"] }
futures = "0.3.31"

sp1-vectorx-script = { path = "script" }
sp1-vectorx-program = { path = "program" }
services = { path = "services" }
sp1-vector-primitives = { path = "primitives" }

# logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
